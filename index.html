<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhr的博客 - 随便写写</title>
    <meta name="description" content="zhr的个人博客">

    <link rel="icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="shortcut icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="apple-touch-icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png">

    <link rel="stylesheet" href="https://zhr-0731.github.io/css/html/prism-tomorrow.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            background: #0a0a0f;
        }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(10,10,15,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 0;
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
        }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo img { height: 36px; border-radius: 50%; }
        .logo-text { font-weight: 600; font-size: 1.2rem; color: rgba(255,255,255,0.95); }
        nav ul { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        nav ul li a { color: rgba(255,255,255,0.7); font-size: 0.9rem; transition: color 0.2s; }
        nav ul li a:hover { color: #fff; }
        .music-controls-compact {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 4px 10px 4px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .play-pause-btn-compact {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 0.9rem; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.06);
        }
        .play-pause-btn-compact .pause-icon { display: none; }
        .play-pause-btn-compact.playing .play-icon { display: none; }
        .play-pause-btn-compact.playing .pause-icon { display: inline; }
        .music-album-compact img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .music-title-compact { font-size: 0.75rem; color: rgba(255,255,255,0.8); white-space: nowrap; }
        .header-search {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.06);
            padding: 4px 8px 4px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header-search input {
            background: transparent; border: none; color: #fff;
            padding: 4px 0; font-size: 0.85rem; outline: none; width: 120px;
        }
        .header-search input::placeholder { color: rgba(255,255,255,0.4); }
        .header-search button {
            background: none; border: none; color: rgba(255,255,255,0.6);
            cursor: pointer; font-size: 1rem;
        }

        .carousel-section {
            position: relative; height: 100vh; overflow: hidden;
        }
        .carousel-container {
            position: relative; width: 100%; height: 100%;
        }
        .carousel-slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.8s ease;
            pointer-events: none; /* 修复：非激活 slide 不接收点击 */
        }
        .carousel-slide.active {
            opacity: 1;
            pointer-events: auto; /* 修复：只有当前 slide 可点击 */
        }
        .carousel-link { display: block; width: 100%; height: 100%; position: relative; }
        .carousel-image { width: 100%; height: 100%; object-fit: cover; }
        .carousel-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 40px 60px 50px;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .carousel-title { font-size: 2.2rem; font-weight: 600; margin-bottom: 6px; }
        .carousel-excerpt { font-size: 1.05rem; opacity: 0.85; max-width: 70%; line-height: 1.6; }
        .carousel-controls {
            position: absolute; top: 50%; width: 100%; transform: translateY(-50%);
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 20;
            pointer-events: none;
        }
        .carousel-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15); color: #fff;
            width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem;
            cursor: pointer; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .carousel-btn:hover { background: rgba(0,0,0,0.6); }
        .carousel-indicators {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 20;
        }
        .indicator {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.35); cursor: pointer;
            transition: background 0.2s, transform 0.2s; border: none; padding: 0;
        }
        .indicator.active { background: #fff; transform: scale(1.25); }

        .main-content { padding: 60px 0 40px; background: transparent !important; }
        .post-feed {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
            background: transparent !important;
        }
        .card-wrapper {
            background: transparent !important;
            transition: transform 0.3s ease;
        }
        .card-wrapper:hover { transform: translateY(-4px); }
        .post-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; height: 100%;
        }
        .post-card:hover {
            transform: translateY(-6px);
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }
        .post-card a { display: flex; flex-direction: column; height: 100%; color: inherit; }
        .post-media { overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .post-media img {
            width: 100%; height: 200px; object-fit: cover;
            transition: transform 0.3s ease; display: block;
        }
        .post-card:hover .post-media img { transform: scale(1.03); }
        .post-content { padding: 16px 20px 12px; flex: 1; }
        .post-tag {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            padding: 2px 12px; border-radius: 30px;
            font-size: 0.7rem; color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.06);
            margin-right: 4px; margin-bottom: 6px;
        }
        .post-title {
            font-size: 1.1rem; font-weight: 600; line-height: 1.4;
            margin: 6px 0 8px; color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .post-excerpt {
            font-size: 0.9rem; color: rgba(255,255,255,0.7);
            line-height: 1.5; text-shadow: 0 1px 6px rgba(0,0,0,0.15);
        }
        .post-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .post-more { font-size: 0.85rem; color: rgba(255,255,255,0.5); transition: color 0.2s; }
        .post-card:hover .post-more { color: #fff; }
        .post-author img {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15); object-fit: cover;
        }
        .feed-status {
            grid-column: 1 / -1; text-align: center;
            color: rgba(255,255,255,0.5); padding: 60px 0; font-size: 0.95rem;
        }

        .newsletter-section { padding: 60px 0; }
        .newsletter-card {
            max-width: 640px; margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 40px 36px; text-align: center;
        }
        .newsletter-title { font-size: 1.8rem; font-weight: 600; margin-bottom: 12px; }
        .newsletter-description { color: rgba(255,255,255,0.7); margin-bottom: 24px; line-height: 1.6; }
        .newsletter-form .form-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .newsletter-input {
            flex: 1; min-width: 200px;
            padding: 14px 18px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #fff; font-size: 1rem; outline: none;
            backdrop-filter: blur(4px);
        }
        .newsletter-input::placeholder { color: rgba(255,255,255,0.4); }
        .newsletter-input:focus { border-color: rgba(255,255,255,0.3); }
        .newsletter-button {
            padding: 14px 32px; border-radius: 30px; border: none;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            color: #fff; font-weight: 600; cursor: pointer;
            transition: background 0.2s; font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .newsletter-button:hover { background: rgba(255,255,255,0.25); }
        .newsletter-footnote { margin-top: 16px; font-size: 0.8rem; color: rgba(255,255,255,0.4); }
        .newsletter-footnote a { color: rgba(255,255,255,0.6); text-decoration: underline; }

        footer { padding: 30px 0; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; }
        .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .footer-nav ul { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .footer-nav a { color: rgba(255,255,255,0.6); font-size: 0.9rem; transition: color 0.2s; }
        .footer-nav a:hover { color: #fff; }
        .powered-by, .rss-subscribe { color: rgba(255,255,255,0.4); font-size: 0.8rem; }
        .rss-subscribe { display: inline-flex; align-items: center; gap: 6px; }

        @media (max-width: 1024px) {
            .post-feed { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .carousel-title { font-size: 1.8rem; }
            .carousel-excerpt { font-size: 0.95rem; max-width: 100%; }
        }
        @media (max-width: 640px) {
            .post-feed { grid-template-columns: 1fr; gap: 16px; }
            .header-inner { flex-direction: column; align-items: stretch; gap: 8px; }
            nav ul { justify-content: center; }
            .header-search { width: 100%; }
            .header-search input { flex: 1; width: auto; }
            .carousel-caption { padding: 20px 24px 30px; }
            .carousel-title { font-size: 1.4rem; }
            .carousel-excerpt { font-size: 0.85rem; }
            .carousel-btn { width: 36px; height: 36px; font-size: 1rem; }
            .newsletter-card { padding: 28px 20px; }
            .newsletter-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <img src="https://s41.ax1x.com/2025/12/06/pZmaGuR.png" alt="zhr">
                    <span class="logo-text">zhr的博客</span>
                </div>
                <nav>
                    <ul>
                        <li class="nav-music-player">
                            <div class="music-controls-compact">
                                <button class="play-pause-btn-compact playing" id="playPauseBtnCompact">
                                    <span class="play-icon">▶</span>
                                    <span class="pause-icon">❚❚</span>
                                </button>
                                <div class="music-album-compact">
                                    <img src="https://s41.ax1x.com/2026/01/10/pZ0cJLq.jpg" alt="专辑封面">
                                </div>

                            </div>
                        </li>
                        <li><a href="index.html">文章|Article</a></li>
                        <li><a href="https://zhr-0731.github.io/zhr-s-videos">视频|Video</a></li>

                </nav>

        </div>
    </header>

    <audio id="backgroundMusic" loop autoplay>
        <source src="http://tvtj.jxwltx.com:8003/hunanws.m3u8" type="application/x-mpegURL">
        您的浏览器不支持音频播放
    </audio>

    <!-- 轮播：slides 与 indicators 由 JS 根据 articles.json 渲染 -->
    <section class="carousel-section">
        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-controls">
                <button class="carousel-btn prev-btn">❮</button>

            </div>
            <div class="carousel-indicators"></div>
        </div>
    </section>

    <!-- 文章列表：由 JS 渲染 -->
    <main class="main-content container">
        <div class="post-feed" id="postFeed">
            <div class="feed-status">正在加载文章…</div>
        </div>
    </main>

    <section class="newsletter-section container">
        <div class="newsletter-card">
            <h2 class="newsletter-title">订阅我的 newsletter</h2>
            <p class="newsletter-description">每周精选文章、生活感悟、旅行故事，直接发送到你的邮箱。随时可以退订。</p>
            <form action="https://buttondown.com/api/emails/embed-subscribe/zhr-0731" method="post" class="embeddable-buttondown-form newsletter-form">
                <div class="form-row">
                    <label for="newsletter-email" class="sr-only">电子邮箱</label>

                    <input type="hidden" name="embed" value="1">

                </div>
                <p class="newsletter-footnote">

    <footer>
        <div class="container">
            <div class="footer-inner">
                <nav class="footer-nav">
                    <ul>
                        <li><a href="https://bgithub.xyz/zhr-0731" target="_blank">GitHub</a></li>
                    </ul>
                </nav>
                <div class="powered-by">基于 GitHub Pages</div>
                <a href="https://zhr-0731.github.io/rss.xml" target="_blank" class="rss-subscribe" rel="noopener noreferrer">
                    <span class="rss-icon">📡</span> RSS 订阅
                </a>
            </div>
        </div>
    </footer>

    <script src="/js/weather-background.js"></script>

    <script>
        const AUTHOR_AVATAR = 'https://s41.ax1x.com/2025/12/06/pZmaGuR.png';
        const FALLBACK_IMAGE = 'https://s41.ax1x.com/2025/12/07/pZnSiid.png';

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        async function loadArticles() {
            const res = await fetch('articles.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        }

        function renderCarousel(articles) {
            const container = document.getElementById('carouselContainer');
            const controls = container.querySelector('.carousel-controls');
            const indicators = container.querySelector('.carousel-indicators');

            container.querySelectorAll('.carousel-slide').forEach(n => n.remove());

            articles.forEach((a, i) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
                slide.dataset.index = i;
                slide.innerHTML = `
                    <a href="${esc(a.link)}" class="carousel-link">
                        <img class="carousel-image" src="${esc(a.image || FALLBACK_IMAGE)}" alt="${esc(a.title)}">
                        <div class="carousel-caption">
                            <h3 class="carousel-title">${esc(a.title)}</h3>
                            <p class="carousel-excerpt">${esc(a.excerpt)}</p>
                        </div>
                    </a>`;
                container.insertBefore(slide, controls);
            });

            indicators.innerHTML = articles.map((_, i) =>
                `<div class="indicator${i === 0 ? ' active' : ''}" data-index="${i}"></div>`
            ).join('');
        }

        function renderCards(articles) {
            const feed = document.getElementById('postFeed');
            if (!articles.length) {
                feed.innerHTML = `<div class="feed-status">暂无文章</div>`;
                return;
            }
            feed.innerHTML = articles.map(a => `
                <div class="card-wrapper">
                    <article class="post-card">
                        <a href="${esc(a.link)}">
                            <div class="post-media">
                                <img class="post-image" src="${esc(a.image || FALLBACK_IMAGE)}" alt="${esc(a.title)}">
                            </div>
                            <div class="post-content">
                                ${(a.tags || []).map(t => `<span class="post-tag">${esc(t)}</span>`).join('')}
                                <h2 class="post-title">${esc(a.title)}</h2>
                                <div class="post-excerpt">${esc(a.excerpt)}</div>
                            </div>
                            <div class="post-footer">
                                <span class="post-more">阅读更多</span>
                                <div class="post-author">
                                    <img class="author-image" src="${AUTHOR_AVATAR}" alt="zhr">
                                </div>
                            </div>
                        </a>
                    </article>
                </div>
            `).join('');
        }

        class Carousel {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.slides = this.container.querySelectorAll('.carousel-slide');
                this.indicators = this.container.querySelectorAll('.indicator');
                this.prevBtn = this.container.querySelector('.prev-btn');
                this.nextBtn = this.container.querySelector('.next-btn');
                this.currentIndex = 0;
                this.totalSlides = this.slides.length;
                this.autoSlideInterval = null;
                this.autoSlideDuration = 5000;
                if (this.totalSlides === 0) return;
                this.init();
            }
            init() {
                this.prevBtn.addEventListener('click', () => this.prevSlide());
                this.nextBtn.addEventListener('click', () => this.nextSlide());
                this.indicators.forEach((indicator, index) => {
                    indicator.addEventListener('click', () => this.goToSlide(index));
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') this.prevSlide();
                    if (e.key === 'ArrowRight') this.nextSlide();
                });
                this.container.addEventListener('mouseenter', () => this.stopAutoSlide());
                this.container.addEventListener('mouseleave', () => this.startAutoSlide());
                this.startAutoSlide();
            }
            updateSlide() {
                this.slides.forEach((slide, index) => {
                    slide.classList.toggle('active', index === this.currentIndex);
                });
                this.indicators.forEach((indicator, index) => {
                    indicator.classList.toggle('active', index === this.currentIndex);
                });
            }
            nextSlide() {
                this.currentIndex = (this.currentIndex + 1) % this.totalSlides;
                this.updateSlide(); this.resetAutoSlide();
            }
            prevSlide() {
                this.currentIndex = (this.currentIndex - 1 + this.totalSlides) % this.totalSlides;
                this.updateSlide(); this.resetAutoSlide();
            }
            goToSlide(index) {
                if (index >= 0 && index < this.totalSlides) {
                    this.currentIndex = index;
                    this.updateSlide(); this.resetAutoSlide();
                }
            }
            startAutoSlide() {
                this.stopAutoSlide();
                this.autoSlideInterval = setInterval(() => this.nextSlide(), this.autoSlideDuration);
            }
            stopAutoSlide() {
                if (this.autoSlideInterval) { clearInterval(this.autoSlideInterval); this.autoSlideInterval = null; }
            }
            resetAutoSlide() { this.stopAutoSlide(); this.startAutoSlide(); }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // 1. 渲染文章
            try {
                const articles = await loadArticles();
                renderCarousel(articles);
                renderCards(articles);
                new Carousel('carouselContainer');
            } catch (err) {
                console.error('加载 articles.json 失败:', err);
                document.getElementById('postFeed').innerHTML =
                    `<div class="feed-status">文章加载失败，请检查 articles.json 是否存在</div>`;
            }

            // 2. 音乐
            const backgroundMusic = document.getElementById('backgroundMusic');
            const playPauseBtnCompact = document.getElementById('playPauseBtnCompact');
            const musicTitle = document.getElementById('musicTitleCompact');

            function setupAutoplay() {
                const playPromise = backgroundMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playPauseBtnCompact.classList.add('playing');
                        musicTitle.textContent = '金鹰955';
                    }).catch(() => {
                        playPauseBtnCompact.classList.remove('playing');
                        musicTitle.textContent = '金鹰955';
                    });
                }
            }
            setTimeout(setupAutoplay, 500);

            playPauseBtnCompact.addEventListener('click', function() {
                if (backgroundMusic.paused) {
                    backgroundMusic.play().then(() => {
                        this.classList.add('playing');
                        musicTitle.textContent = '金鹰955';
                    }).catch(() => {
                        musicTitle.textContent = '播放失败，点击重试';
                    });
                } else {
                    backgroundMusic.pause();
                    this.classList.remove('playing');
                    musicTitle.textContent = '金鹰955';
                }
            });

            backgroundMusic.addEventListener('play', function() {
                playPauseBtnCompact.classList.add('playing');
                musicTitle.textContent = '金鹰955';
            });
            backgroundMusic.addEventListener('pause', function() {
                playPauseBtnCompact.classList.remove('playing');
                musicTitle.textContent = '金鹰955';
            });
            backgroundMusic.addEventListener('ended', function() {
                playPauseBtnCompact.classList.remove('playing');
                musicTitle.textContent = '播放结束，点击重播';
            });
            backgroundMusic.addEventListener('error', function() {
                playPauseBtnCompact.disabled = true;
                musicTitle.textContent = '音频加载失败';
                backgroundMusic.innerHTML = '<source src="https://bgithub.xyz/zhr-0731/Music-file/raw/refs/heads/main/Reach%20Me%20-%20Track%20in%20Time%20(%E7%BA%AF%E9%92%A2%E7%90%B4).mp3" type="audio/mpeg">';
                backgroundMusic.load();
                musicTitle.textContent = '切换到备用音频';
            });

            // 3. 搜索
            const searchInput = document.getElementById('searchQuery');
            const searchBtn = document.getElementById('searchSubmitBtn');

            function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = 'https://zhr-0731.github.io/search.html?q=' + encodeURIComponent(query);
                }
            }
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') performSearch();
            });
        });
    </script>

    <script src="/js/theme.js"></script>
</body>
</html>
