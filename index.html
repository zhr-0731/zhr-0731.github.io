<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zhr的博客 - 随便写写</title>
    <meta name="description" content="zhr的个人博客">

    <!-- 网页图标 -->
    <link rel="icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="shortcut icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="apple-touch-icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png">

    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://zhr-0731.github.io/css/html/prism-tomorrow.min.css">

    <!-- 站点样式（使用相对路径） -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/carousel.css">
    <link rel="stylesheet" href="css/post-feed.css">
    <link rel="stylesheet" href="css/newsletter.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- 首页专属布局样式 -->
    <style>
        .hero-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 85px 20px 10px 20px;
            max-width: 1200px; 
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* 上半部分 */
        .hero-top {
            display: grid;
            grid-template-columns: 1fr 2.2fr;
            gap: 15px;
            height: 480px; 
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        
        .window-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #window-1 { flex: 0.618; }
        #window-2 { flex: 0.382; }

        .hero-right {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(255,255,255,0.02);
        }

        .hero-right .carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .window-box iframe:not(.music-iframe) {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* 核心修改：给足 100px 高度，防止网易云底部被裁 */
        .hero-bottom {
            height: 100px; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 核心修改：设置 display: block; 消除 iframe 底部留白 */
        .music-iframe {
            width: 100%;
            height: 86px;
            border: none;
            border-radius: 12px; 
            background: #fff;
            display: block; 
        }

        .main-content {
            padding-top: 20px !important; 
        }

        @media (max-width: 768px) {
            .hero-layout {
                padding-top: 130px;
            }
            .hero-top {
                grid-template-columns: 1fr;
                height: auto; 
            }
            .hero-left { height: 350px; }
            .hero-right { height: 400px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <img src="https://s41.ax1x.com/2025/12/06/pZmaGuR.png" alt="zhr">
                    <span class="logo-text">zhr的博客</span>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">文章|Article</a></li>
                        <li><a href="https://zhr-0731.github.io/zhr-s-videos">视频|Video</a></li>
                    </ul>
                </nav>
                <div class="header-search">
                    <input type="text" id="searchQuery" placeholder="搜索文章..." autocomplete="off">
                    <button id="searchSubmitBtn">🔍</button>
                </div>
            </div>
        </div>
    </header>

    <section class="hero-layout">
        <div class="hero-top">
            <div class="hero-left">
                <div id="window-1" class="window-box">
                    <iframe src="widget/div-1.html" scrolling="no"></iframe>
                </div>
                <div id="window-2" class="window-box">
                    <iframe src="widget/div-2.html" scrolling="no"></iframe>
                </div>
            </div>
            <div class="hero-right">
                <div class="carousel-container" id="carouselContainer">
                    <div class="carousel-controls">
                        <button class="carousel-btn prev-btn">❮</button>
                        <button class="carousel-btn next-btn">❯</button>
                    </div>
                    <div class="carousel-indicators"></div>
                </div>
            </div>
        </div>

        <!-- 给足 100px 高度 -->
        <div class="hero-bottom">
            <iframe class="music-iframe" frameborder="no" border="0" marginwidth="0" marginheight="0" 
                    src="https://music.163.com/outchain/player?type=2&id=2022748660&auto=0&height=86">
            </iframe>
        </div>
    </section>

    <main class="main-content container">
        <div class="post-feed" id="postFeed">
            <div class="feed-status">正在加载文章…</div>
        </div>
    </main>

    <section class="newsletter-section container">
        <div class="newsletter-card">
            <h2 class="newsletter-title">订阅我的 newsletter</h2>
            <p class="newsletter-description">每周精选文章、生活感悟、旅行故事，直接发送到你的邮箱。随时可以退订。</p>
            <form action="https://buttondown.com/api/emails/embed-subscribe/zhr-0731" method="post" class="embeddable-buttondown-form newsletter-form">
                <div class="form-row">
                    <label for="newsletter-email" class="sr-only">电子邮箱</label>
                    <input type="email" name="email" id="newsletter-email" class="newsletter-input" placeholder="your@email.com" required>
                    <input type="hidden" name="embed" value="1">
                    <button type="submit" class="newsletter-button">订阅</button>
                </div>
                <p class="newsletter-footnote">
                    <a href="https://buttondown.com" target="_blank">Powered by Buttondown.</a>
                    尊重你的隐私，不发送垃圾邮件。
                </p>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <nav class="footer-nav">
                    <ul>
                        <li><a href="https://bgithub.xyz/zhr-0731" target="_blank">GitHub</a></li>
                    </ul>
                </nav>
                <div class="powered-by">基于 GitHub Pages</div>
                <a href="https://zhr-0731.github.io/rss.xml" target="_blank" class="rss-subscribe" rel="noopener noreferrer">
                    <span class="rss-icon">📡</span> RSS 订阅
                </a>
            </div>
        </div>
    </footer>

    <script src="/js/weather-background.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/articles.js"></script>
    <script src="js/carousel.js"></script>
    <script src="js/search.js"></script>
    <script src="js/index.js"></script>
    <script src="/js/theme.js"></script>
</body>
</html>
