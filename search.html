<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索文章</title>

    <link rel="icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="shortcut icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png" type="image/png">
    <link rel="apple-touch-icon" href="https://s41.ax1x.com/2025/12/07/pZnSiid.png">

    <style>
        :root {
            --ghost-accent-color: #59c090;
            --text-color: #333;
            --bg-color: #fff;
            --light-gray: #f5f5f5;
            --border-color: #eaeaea;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; transition: color 0.3s; }
        a:hover { color: var(--ghost-accent-color); }
        img { max-width: 100%; height: auto; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo { display: flex; align-items: center; }
        .logo img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .logo-text { font-weight: bold; font-size: 1.2rem; }

        nav ul { display: flex; list-style: none; }
        nav li { margin-left: 25px; }
        nav a { font-size: 0.9rem; font-weight: 500; }

        .header-actions { display: flex; align-items: center; }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-color);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .search-btn:hover { background: var(--light-gray); }

        .search-page-container { padding: 60px 0; flex: 1; }
        .search-header { margin-bottom: 40px; }
        .search-title { font-size: 2rem; font-family: var(--font-serif); margin-bottom: 10px; }

        .search-box { max-width: 1000px; margin: 0 auto 60px; position: relative; }

        .search-form {
            display: flex;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 50px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .search-form:focus-within { border-color: var(--ghost-accent-color); }

        .search-input {
            flex: 1;
            padding: 22px 35px;
            font-size: 1.3rem;
            border: none;
            outline: none;
            font-family: var(--font-sans);
        }

        .search-button {
            background: var(--ghost-accent-color);
            color: white;
            border: none;
            padding: 0 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .search-button:hover { background: #4aa97a; }

        .search-results { max-width: 1000px; margin: 0 auto; }

        .search-stats {
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item {
            margin-bottom: 50px;
            padding: 0;
            border-radius: 12px;
            background: white;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
            overflow: hidden;
            display: flex;
        }

        .search-result-item:hover {
            border-color: var(--ghost-accent-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .result-content { flex: 1; padding: 30px; }

        .result-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-family: var(--font-serif);
            line-height: 1.3;
            color: var(--text-color);
        }

        .result-title:hover { color: var(--ghost-accent-color); }

        .result-excerpt { color: #666; margin-bottom: 20px; font-size: 1rem; line-height: 1.6; }
        .result-date { color: #888; font-size: 0.9rem; }

        .result-image { width: 250px; height: 200px; overflow: hidden; position: relative; }

        .result-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .search-result-item:hover .result-image img { transform: scale(1.05); }

        .no-results { text-align: center; padding: 80px 20px; color: #888; }
        .no-results-icon { font-size: 3.5rem; margin-bottom: 25px; opacity: 0.5; }
        .no-results-title { font-size: 1.7rem; margin-bottom: 15px; }
        .no-results-text { font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        footer {
            background: var(--light-gray);
            padding: 50px 0;
            margin-top: auto;
            border-top: 1px solid var(--border-color);
        }

        .footer-inner { display: flex; justify-content: space-between; align-items: center; }
        .copyright { color: #888; }
        .footer-nav ul { display: flex; list-style: none; }
        .footer-nav li { margin-left: 20px; }
        .powered-by { color: #888; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .header-inner { flex-direction: column; align-items: flex-start; }
            nav ul { margin-top: 15px; flex-wrap: wrap; }
            nav li { margin: 5px 15px 5px 0; }
            .search-title { font-size: 1.7rem; }
            .search-input { padding: 18px 25px; font-size: 1.1rem; }
            .search-button { padding: 0 30px; font-size: 1rem; }
            .search-result-item { flex-direction: column; }
            .result-image { width: 100%; height: 200px; order: -1; }
            .result-content { padding: 25px; }
            .result-title { font-size: 1.3rem; }
            .footer-inner { flex-direction: column; text-align: center; }
            .footer-nav ul { margin: 20px 0; justify-content: center; }
            .footer-nav li { margin: 0 10px; }
        }

        @media (max-width: 480px) {
            .search-title { font-size: 1.5rem; }
            .search-form { flex-direction: column; border-radius: 12px; }
            .search-input { padding: 15px; border-bottom: 1px solid var(--border-color); }
            .search-button { padding: 15px; width: 100%; }
            .result-image { height: 180px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <a href="index.html">
                        <img src="https://s41.ax1x.com/2025/12/06/pZmaGuR.png" alt="zhr">
                        <span class="logo-text">zhr的博客</span>
                    </a>
                </div>

                <nav>
                    <ul>
                        <li><a href="index.html">文章|Article</a></li>
                        <li><a href="https://zhr-0731.github.io/zhr-s-videos">视频|Video</a></li>
                    </ul>
                </nav>

                <div class="header-actions">
                    <a href="search.html" class="search-btn">🔍</a>
                </div>
            </div>
        </div>
    </header>

    <main class="search-page-container container">
        <div class="search-header">
            <h1 class="search-title">搜索</h1>
        </div>

        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    name="q"
                    placeholder="输入关键词搜索..."
                    autocomplete="off"
                    value=""
                >
                <button type="submit" class="search-button">搜索</button>
            </form>
        </div>

        <div class="search-results" id="searchResults">
            <div class="search-stats" id="searchStats">正在加载文章索引…</div>
            <div id="resultsList">
                <div class="no-results">
                    <div class="no-results-icon">🔍</div>
                    <h3 class="no-results-title">输入关键词搜索文章</h3>
                    <p class="no-results-text">文章索引加载完成后即可搜索</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <nav class="footer-nav">
                    <ul>
                        <li><a href="https://bgithub.xyz/zhr-0731" target="_blank">GitHub</a></li>
                    </ul>
                </nav>
                <div class="powered-by">基于 GitHub Pages</div>
            </div>
        </div>
    </footer>

    <script>
        let articles = [];

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        async function loadArticles() {
            const res = await fetch('articles.json', { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return await res.json();
        }

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function highlightText(text, keyword) {
            const safe = esc(text);
            if (!keyword) return safe;
            const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return safe.replace(regex, '<mark class="highlight">$1</mark>');
        }

        function emptyState(keyword) {
            const stats = document.getElementById('searchStats');
            const list = document.getElementById('resultsList');
            if (!keyword) {
                stats.textContent = '输入关键词开始搜索';
                list.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3 class="no-results-title">输入关键词搜索文章</h3>
                        <p class="no-results-text">尝试搜索"GitHub"、"博客"、"生活"、"重庆"、"AI"等关键词</p>
                    </div>`;
            }
        }

        function performSearch(keyword) {
            if (!keyword) {
                emptyState('');
                return;
            }

            const newUrl = `${window.location.pathname}?q=${encodeURIComponent(keyword)}`;
            window.history.pushState({ keyword }, '', newUrl);

            const results = articles.filter(article => {
                const haystack = [
                    article.title,
                    article.excerpt,
                    ...(article.tags || [])
                ].join(' ').toLowerCase();
                return haystack.includes(keyword.toLowerCase());
            });

            const searchStats = document.getElementById('searchStats');
            const resultsList = document.getElementById('resultsList');

            if (results.length === 0) {
                searchStats.textContent = `没有找到与"${keyword}"相关的结果`;
                resultsList.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔎</div>
                        <h3 class="no-results-title">未找到相关文章</h3>
                        <p class="no-results-text">尝试使用其他关键词搜索</p>
                    </div>`;
                return;
            }

            searchStats.textContent = `找到 ${results.length} 条与"${keyword}"相关的结果`;
            resultsList.innerHTML = results.map(article => `
                <div class="search-result-item">
                    <div class="result-content">
                        <a href="${esc(article.link)}" class="result-title">${highlightText(article.title, keyword)}</a>
                        <div class="result-excerpt">${highlightText(article.excerpt, keyword)}</div>
                        <div class="result-date">${esc(article.date)}</div>
                    </div>
                    <div class="result-image">
                        <a href="${esc(article.link)}">
                            <img src="${esc(article.image)}" alt="${esc(article.title)}">
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');

            try {
                articles = await loadArticles();
            } catch (err) {
                console.error('加载 articles.json 失败:', err);
                document.getElementById('searchStats').textContent = '文章索引加载失败';
                document.getElementById('resultsList').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">⚠️</div>
                        <h3 class="no-results-title">索引加载失败</h3>
                        <p class="no-results-text">请确认根目录下存在 articles.json</p>
                    </div>`;
                return;
            }

            const initialKeyword = getQueryParam('q');
            if (initialKeyword) {
                searchInput.value = initialKeyword;
                performSearch(initialKeyword);
            } else {
                emptyState('');
                setTimeout(() => searchInput.focus(), 300);
            }

            searchForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const keyword = searchInput.value.trim();
                if (keyword) performSearch(keyword);
            });

            window.addEventListener('popstate', function() {
                const keyword = getQueryParam('q');
                if (keyword) {
                    searchInput.value = keyword;
                    performSearch(keyword);
                } else {
                    searchInput.value = '';
                    emptyState('');
                }
            });
        });

        const style = document.createElement('style');
        style.textContent = `
            .highlight { background-color: rgba(89, 192, 144, 0.2); padding: 0 2px; border-radius: 2px; font-weight: 500; }
            .search-input::placeholder { color: #999; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
