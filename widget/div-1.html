<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历</title>
    <!-- 引入 Pacifico 英文字体 -->
    <link href="https://fonts.font.im/css?family=Pacifico" rel="stylesheet" type="text/css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-wrapper {
            width: 100%; 
            height: 100%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 12px;
        }

        .calendar {
            height: 100%;
            max-width: 100%;
            aspect-ratio: 7 / 10; 
            display: flex; 
            flex-direction: column;
            gap: 8px; /* 稍微拉大整体间距 */
        }

        /* 头部：左上角标题 + 右上角按钮  */
        .header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start; /* 顶部对齐 */
            padding-bottom: 2px;
        }

        /* 左上角月份信息 */
        .month-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 左对齐 */
            justify-content: center;
            line-height: 1.1;
        }
        
        /* 英文月份 */
        .en-month {
            font-family: 'Pacifico', cursive;
            font-size: clamp(18px, 5vh, 24px);
            color: #59c090;
            text-shadow: 0 2px 6px rgba(89, 192, 144, 0.3);
            letter-spacing: 1px;
        }
        
        /* 中文年月 */
        .cn-month {
            font-size: clamp(10px, 2.5vh, 12px);
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            margin-left: 2px;
        }

        /* 右上角按钮组 */
        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .controls button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.05);
            color: #fff;
            width: 24px; height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem;
        }
        .controls button:hover { 
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .weekdays {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: clamp(10px, 2.5vh, 13px);
            color: rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.08); /* 加一条分割线更精致 */
            padding-bottom: 6px;
        }

        .days {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 2px;
            margin-top: 2px;
        }

        .day {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10px, 2.8vh, 14px);
            border-radius: 50%;
            color: rgba(255,255,255,0.8);
            transition: all 0.2s;
            cursor: default;
        }
        .day:hover:not(.empty) { background: rgba(255,255,255,0.1); }
        .day.empty { opacity: 0; pointer-events: none; }
        
        .day.today {
            background: #59c090;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(89, 192, 144, 0.4);
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="calendar">
            <!-- 头部区域 -->
            <div class="header">
                <!-- 左侧英文月份与中文 -->
                <div class="month-title">
                    <span class="en-month" id="enMonth"></span>
                    <span class="cn-month" id="cnMonth"></span>
                </div>
                <!-- 右侧切换按钮 -->
                <div class="controls">
                    <button id="prevBtn">❮</button>
                    <button id="nextBtn">❯</button>
                </div>
            </div>
            
            <!-- 星期 -->
            <div class="weekdays">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            
            <!-- 日期格子 -->
            <div class="days" id="days"></div>
        </div>
    </div>

    <script>
        // 英文月份数组
        const enMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let currentDate = new Date();
        
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // 更新英文和中文月份
            document.getElementById('enMonth').textContent = enMonths[month];
            document.getElementById('cnMonth').textContent = `${year}年 ${month + 1}月`;
            
            const daysContainer = document.getElementById('days');
            daysContainer.innerHTML = '';
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            
            // 补全前面的空白
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day empty';
                daysContainer.appendChild(emptyCell);
            }
            
            // 填充当月日期
            for (let i = 1; i <= daysInMonth; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day';
                dayCell.textContent = i;
                
                if (isCurrentMonth && i === today.getDate()) {
                    dayCell.classList.add('today');
                }
                daysContainer.appendChild(dayCell);
            }

            // 补全末尾空白，保证总是 6 行
            const totalCells = firstDay + daysInMonth;
            const remainingCells = 42 - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day empty';
                daysContainer.appendChild(emptyCell);
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
