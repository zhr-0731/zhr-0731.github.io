<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden; /* 禁止出现滚动条 */
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            background: transparent;
            display: flex;
            flex-direction: column;
        }
        .calendar {
            width: 100%;
            height: 100%;
            padding: 12px 16px; /* 缩小内边距，给日历留更多空间 */
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: 600;
        }
        .header button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 26px; height: 26px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }
        .header button:hover { background: rgba(255,255,255,0.2); }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr); /* 固定6行，自适应高度 */
            gap: 4px;
            flex: 1; /* 占满剩余所有空间 */
        }
        .day {
            /* 去掉 aspect-ratio: 1，让格子随容器拉伸 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border-radius: 6px; /* 改为圆角矩形更好看 */
            color: rgba(255,255,255,0.8);
            transition: all 0.2s;
        }
        .day:hover:not(.empty) { background: rgba(255,255,255,0.1); }
        .day.empty { opacity: 0; pointer-events: none; }
        .day.today {
            background: #59c090;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(89, 192, 144, 0.4);
        }
    </style>
</head>
<body>
    <div class="calendar">
        <div class="header">
            <button id="prevBtn">❮</button>
            <span id="monthYear"></span>
            <button id="nextBtn">❯</button>
        </div>
        <div class="weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="days" id="days"></div>
    </div>

    <script>
        let currentDate = new Date();
        
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthYear').textContent = `${year}年 ${month + 1}月`;
            
            const daysContainer = document.getElementById('days');
            daysContainer.innerHTML = '';
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            
            // 补全前面的空白
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day empty';
                daysContainer.appendChild(emptyCell);
            }
            
            // 填充当月日期
            for (let i = 1; i <= daysInMonth; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day';
                dayCell.textContent = i;
                
                if (isCurrentMonth && i === today.getDate()) {
                    dayCell.classList.add('today');
                }
                daysContainer.appendChild(dayCell);
            }

            // 补全末尾的空白，保证总是 6 行 (42个格子)，高度不抖动
            const totalCells = firstDay + daysInMonth;
            const remainingCells = 42 - totalCells;
            for (let i = 0; i < remainingCells; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day empty';
                daysContainer.appendChild(emptyCell);
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
