rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        raven-actions/*: ref-pin
        zizmorcore/*: ref-pin
        aquasecurity/*: ref-pin
        "*": hash-pin

  artipacked:
    ignore:
      # 以下工作流末尾均有 git push 操作，必须保留 checkout 默认凭证持久化
      - download-css.yml
      - check-new-posts.yml
      - send-newsletter.yml
      - build-articles.yml