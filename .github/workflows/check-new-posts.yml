name: Check for New Posts and Update RSS

on:
  # 定时触发：每小时的第0分钟运行一次（UTC时间）
  schedule:
    - cron: '0 * * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码，使用 GH_TOKEN 以便有权限推送回仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Python 依赖（包括 lxml，用于生成带 CDATA 的 RSS）
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # 4. 运行核心脚本
      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python .github/scripts/update_rss.py

      # 5. 提交并推送所有更改（如果有的话）
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: update RSS feed with latest posts [skip ci]" || exit 0
          git push
