name: Build articles.json

on:
  push:
    paths:
      - 'post/*.html'
      - 'scripts/build_articles.py'
      - '.github/workflows/build-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install beautifulsoup4

      - run: python scripts/build_articles.py

      - name: Commit articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain articles.json)" ]; then
            git add articles.json
            git commit -m "chore: update articles.json"
            git push
          else
            echo "articles.json 无变化，跳过提交"
          fi