name: Add License to Posts

on:
  workflow_dispatch: # 严格仅限手动触发

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run python script
        run: python .github/scripts/add_license.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto add CC license to post footers"
          file_pattern: 'post/*.html'