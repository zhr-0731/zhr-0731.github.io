name: Auto Add License to Post Footers

on:
  workflow_dispatch: # 允许你手动在 Actions 页面点击运行
  push:
    branches:
      - main
    paths:
      - 'post/**.html' # 仅当 post 文件夹下有 html 变动时触发

jobs:
  inject-license:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予自动 push 代码的权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run injection script
        run: |
          cat << 'EOF' > script.js
          const fs = require('fs');
          const path = require('path');

          // 严格指定为 post 文件夹
          const POST_DIR = 'post';

          if (!fs.existsSync(POST_DIR)) {
              console.log(`目录 ${POST_DIR} 不存在，退出。`);
              process.exit(0);
          }

          const files = fs.readdirSync(POST_DIR).filter(file => file.endsWith('.html'));

          // 针对你单篇文章浅灰背景设计的许可证样式
          const footerStyle = `
        /* ===== 自动注入的许可证信息 ===== */
        .footer-license {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            text-align: center;
            font-size: 0.8rem;
            line-height: 1.8;
            color: #888;
            width: 100%;
        }
        .footer-license p { margin: 0 0 4px; }
        .footer-license a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.2s;
        }
        .footer-license a:hover { color: var(--ghost-accent-color); }
        .footer-license .license-icons {
            display: inline-flex;
            gap: 3px;
            margin-left: 6px;
            vertical-align: -0.15em;
            text-decoration: none;
        }
        .footer-license .license-icons img {
            width: 1em;
            height: 1em;
            display: block;
            filter: invert(0.5); /* 适配浅灰背景的图标颜色 */
        }
        .footer-license .license-note {
            font-size: 0.75rem;
            opacity: 0.85;
        }
          `;

          // 注入的 HTML
          const licenseHtml = `
        <!-- 许可证信息 -->
        <div class="footer-license container" xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/">
            <p class="license-line">
                <a property="dct:title" rel="cc:attributionURL" href="https://zhr-0731.github.io" target="_blank" rel="noopener noreferrer">zhr的博客</a>
                © 2025 by
                <a rel="cc:attributionURL dct:creator" property="cc:attributionName" href="https://zhr-0731.github.io" target="_blank" rel="noopener noreferrer">zhr-0731</a>
                is licensed under
                <a rel="license" class="license-link"
                   href="https://creativecommons.org/licenses/by-nc/4.0/"
                   target="_blank" rel="noopener noreferrer"
                   title="Creative Commons Attribution-NonCommercial 4.0 International">CC BY-NC 4.0</a><a class="license-icons"
                   href="https://creativecommons.org/licenses/by-nc/4.0/"
                   target="_blank" rel="noopener noreferrer"
                   aria-label="Creative Commons BY-NC 4.0"><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="NC"></a>
            </p>
            <p class="license-note">作者依法保留保护作品完整权，被许可人不得以歪曲、篡改或其他方式改变作者原意。</p>
            <p class="license-note">本许可不适用于本博客中引用的第三方图片、视频等素材。</p>
        </div>
          `;

          files.forEach(file => {
              const fullPath = path.join(POST_DIR, file);
              let content = fs.readFileSync(fullPath, 'utf8');

              // 防重复注入检查
              if (content.includes('class="footer-license')) {
                  console.log(`[SKIP] ${file} 已包含许可证，跳过。`);
                  return;
              }

              let modified = false;

              // 1. 注入 CSS（在 </style> 之前插入）
              if (content.includes('</style>')) {
                  content = content.replace(/<\/style>/, `${footerStyle}\n    </style>`);
                  modified = true;
              }

              // 2. 注入 HTML（在 </footer> 前面插入）
              if (content.includes('</footer>')) {
                  // 直接用 replace 插入到 </footer> 标签前
                  content = content.replace(/<\/footer>/, `${licenseHtml}\n    </footer>`);
                  modified = true;
              }

              if (modified) {
                  fs.writeFileSync(fullPath, content, 'utf8');
                  console.log(`[MODIFIED] ${file} 已成功添加许可证。`);
              }
          });
          EOF
          
          node script.js

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto add CC license to post footers"
          file_pattern: 'post/*.html'