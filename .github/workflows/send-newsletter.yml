name: Send Newsletter via Buttondown

on:
  push:
    branches:
      - main
    paths:
      - 'post/**'
  workflow_dispatch:

# 👇 1. 添加明确的权限声明（修复 CodeQL 警告）
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # 👇 2. 升级到 v4，并禁用凭证持久化（安全最佳实践）
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        # 👇 3. 升级到 v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 html2text

      - name: Run Buttondown script
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          REPO: ${{ github.repository }}
        run: python scripts/send_buttondown.py