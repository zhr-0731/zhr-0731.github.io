name: Send Newsletter via MailerLite

on:
  # 当推送代码到 main 分支，且修改了 post 文件夹下的文件时触发
  push:
    branches:
      - main
    paths:
      - 'post/**'
  # 允许手动触发工作流（方便测试）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # 需要获取最近两次提交以计算差异
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run MailerLite script
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          REPO: ${{ github.repository }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: python scripts/send_mailerlite.py
