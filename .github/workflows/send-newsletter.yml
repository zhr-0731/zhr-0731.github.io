name: Send Newsletter via MailerLite

on:
  push:
    branches:
      - main
    paths:
      - 'post/**'          # 只有 post 文件夹变化时才触发
  workflow_dispatch:        # 允许手动触发，方便测试

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2    # 获取最近两次提交，用于检测新增文件

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run MailerLite script
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          REPO: ${{ github.repository }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}   # 你自己的邮箱，用于接收测试邮件
        run: python scripts/send_mailerlite.py
