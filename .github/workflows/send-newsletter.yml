name: Send Newsletter via Buttondown

on:
  push:
    branches:
      - main
    paths:
      - 'post/**'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 html2text

      - name: Run Buttondown script
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          REPO: ${{ github.repository }}
        run: python scripts/send_buttondown.py
