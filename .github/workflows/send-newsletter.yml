name: Send Newsletter via MailerLite

on:
  push:
    branches:
      - main
    paths:
      - 'post/**'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Show current directory
        run: pwd

      - name: List root files
        run: ls -la

      - name: List scripts folder (if exists)
        run: ls -la scripts/ || echo "scripts folder not found"

      - name: Recursively search for send_mailerlite.py
        run: find . -name "send_mailerlite.py" -type f

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests GitPython

      - name: Run MailerLite script
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          REPO: ${{ github.repository }}
        run: python scripts/send_mailerlite.py
