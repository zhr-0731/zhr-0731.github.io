name: Security Gate

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  # ── 1. 工作流自身审计：actionlint + zizmor ──
  workflow-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: zizmor（发现即失败）
        uses: zizmorcore/zizmor-action@v0.7.0
        with:
          advanced-security: false   # 私有仓库免费模式：日志输出 + 失败 job
          min-severity: medium

  # ── 2. 依赖审查：OSV-Scanner（PR 增量） ──
  dependency-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 允许在 PR 中评论结果（不需要 GHAS）
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --lockfile=./requirements.txt
            --format=markdown
            --output=osv-results.md

      - name: 在 PR 中评论结果
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: osv-results.md

      - name: 高危/严重漏洞阻断合并
        run: |
          if grep -qE '\b(HIGH|CRITICAL)\b' osv-results.md; then
            echo "❌ 检测到高危或严重依赖漏洞，PR 被阻断。"
            exit 1
          fi