name: Security Gate

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# 全局默认清空权限，按需在各个 Job 中分配（遵循最小权限原则）
permissions: {}

jobs:
  # ── 1. CodeQL 官方代码扫描（整合了高级配置） ──
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # 需要此权限来上传扫描结果
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # 注意：这里必须写 javascript，不要写 javascript-typescript
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── 2. 工作流自身审计：actionlint + zizmor ──
  workflow-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0

      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
          min-severity: medium

  # ── 3. 依赖漏洞扫描（OSV-Scanner） ──
  dependency-scan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 OSV-Scanner
        run: |
          OSV_VERSION=2.4.0
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: 扫描锁文件并阻断高危
        run: |
          set -euo pipefail
          LOCK_ARGS=""
          for f in package-lock.json yarn.lock pnpm-lock.yaml requirements.txt poetry.lock go.sum Cargo.lock; do
            [ -f "$f" ] && LOCK_ARGS="$LOCK_ARGS -L $f"
          done
          [ -z "$LOCK_ARGS" ] && { echo "未发现锁文件，跳过"; exit 0; }

          osv-scanner scan $LOCK_ARGS --format=markdown --output=osv-results.md || true

          if grep -qiE '\b(HIGH|CRITICAL)\b' osv-results.md; then
            echo "❌ 检测到高危或严重依赖漏洞，PR 被阻断。"
            cat osv-results.md
            exit 1
          fi
          echo "✅ 未发现高危依赖漏洞。"

  # ── 4. SAST：Semgrep ──
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Semgrep 扫描（发现 ERROR 即失败）
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --severity=ERROR \
            --error \
            --text

  # ── 5. Trivy：修复版本号，改为上传 SARIF 格式 ──
  trivy:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # 需要此权限来上传 SARIF
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy fs & IaC 扫描
        # 👇 修复：去掉了 0.36.0 前面的 v
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'   # 设为 0，避免发现漏洞导致整个 Job 失败，结果交给安全面板展示

      - name: 上传 Trivy 结果到 GitHub 安全面板
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
