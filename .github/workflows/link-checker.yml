name: Broken Link Checker

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一 00:00 (UTC) 自动执行
  workflow_dispatch:    # 允许手动触发测试

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lychee Broken Link Checker
        id: lychee
        # 👇 完美替换为你提供的 v2.9.0 哈希
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress './**/*.md' './**/*.html'
          fail: false # 不直接报错，而是生成报告

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        # 👇 提 Issue 工具（peter-evans v5）的 SHA 哈希
        uses: peter-evans/create-issue-from-file@d5fd9d5b72d5f41355b09ebc8c8fb7a8205259b7 # v5
        with:
          title: "🔗 发现失效链接，请及时修复"
          content-filepath: ./lychee/out.md
          labels: report, automated issue