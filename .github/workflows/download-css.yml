name: Download CSS assets

on:
  workflow_dispatch:        # 仅手动触发，避免自动运行

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create css/html directory
        run: mkdir -p css/html

      - name: Download screen.css (Ghost main style)
        run: curl -L -o css/html/screen.css "https://www.domon.cn/assets/built/screen.css?v=9649418e97"

      - name: Download cards.min.css (Ghost cards)
        run: curl -L -o css/html/cards.min.css "https://www.domon.cn/public/cards.min.css?v=9649418e97"

      - name: Download prism-tomorrow.min.css (code highlight)
        run: curl -L -o css/html/prism-tomorrow.min.css "https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/themes/prism-tomorrow.min.css"

      - name: Download sodo-search main.css (search component)
        run: curl -L -o css/html/main.css "https://cdn.jsdelivr.net/ghost/sodo-search@~1.8/umd/main.css"

      - name: List downloaded files (optional)
        run: ls -l css/html