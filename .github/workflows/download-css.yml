name: Download and commit CSS assets

on:
  workflow_dispatch:        # 手动触发

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 确保有写入权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create css directory
        run: mkdir -p css

      - name: Download CSS files
        run: |
          curl -L -o css/screen.css "https://www.domon.cn/assets/built/screen.css?v=9649418e97"
          curl -L -o css/cards.min.css "https://www.domon.cn/public/cards.min.css?v=9649418e97"
          curl -L -o css/prism-tomorrow.min.css "https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/themes/prism-tomorrow.min.css"
          curl -L -o css/main.css "https://cdn.jsdelivr.net/ghost/sodo-search@~1.8/umd/main.css"

      - name: Force add and commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f css/                      # 强制添加（绕过 .gitignore，但你没有）
          git commit -m "Download latest CSS assets" || echo "Nothing new to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
