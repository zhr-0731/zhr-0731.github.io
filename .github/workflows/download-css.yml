name: Download and commit CSS assets

on:
  workflow_dispatch:        # 手动触发，安全可控

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create css/html directory
        run: mkdir -p css/html

      - name: Download CSS files
        run: |
          curl -L -o css/html/screen.css "https://www.domon.cn/assets/built/screen.css?v=9649418e97"
          curl -L -o css/html/cards.min.css "https://www.domon.cn/public/cards.min.css?v=9649418e97"
          curl -L -o css/html/prism-tomorrow.min.css "https://cdnjs.cloudflare.com/ajax/libs/prism/1.28.0/themes/prism-tomorrow.min.css"
          curl -L -o css/html/main.css "https://cdn.jsdelivr.net/ghost/sodo-search@~1.8/umd/main.css"

      - name: Check if css/html has changes
        id: check_changes
        run: |
          if git diff --quiet -- css/html; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add css/html/
          git commit -m "Update CSS assets (screen, cards, prism, sodo-search)"
          git push