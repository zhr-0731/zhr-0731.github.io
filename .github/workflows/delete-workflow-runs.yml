name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日 00:00 (UTC) 自动执行
  workflow_dispatch:    # 允许手动触发测试

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        # 👇 使用你提供的删除器 SHA 哈希
        uses: Mattraks/delete-workflow-runs@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5