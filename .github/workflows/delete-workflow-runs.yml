name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日 00:00 (UTC) 自动执行
  workflow_dispatch:    # 允许手动触发测试

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        # 👇 修复：将 @v2.1.0 替换为完整的 Commit Hash (SHA)
        uses: Mattraks/delete-workflow-runs@f9b7bf7bd6711a1f731a2c8c89e6b8ea2c2d12d3 # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 5