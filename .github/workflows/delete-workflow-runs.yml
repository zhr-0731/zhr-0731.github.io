name: Delete old workflow runs
on:
  schedule:
    - cron: '0 0 * * 0' # 每周日运行
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7 # 只保留最近7天的记录
          keep_minimum_runs: 5 # 每种工作流至少保留5条