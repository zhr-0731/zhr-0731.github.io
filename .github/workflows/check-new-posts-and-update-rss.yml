name: Check for New Posts and Update RSS

on:
  # 1. 每次 post 文件夹有更新时触发
  push:
    paths:
      - 'post/**.html'
  
  # 2. 每年年初自动触发（UTC时间 1月1日 00:00，即北京时间 1月1日 08:00）
  schedule:
    - cron: '0 0 1 1 *'
  
  # 3. 允许手动触发，方便测试
  workflow_dispatch:

# 赋予自动推送代码的写权限
permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Python 依赖
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      # 4. 运行核心脚本
      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_rss.py

      # 5. 提交并推送所有更改
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 因为脚本会修改 post/*.html，补全许可证/年份，同时更新 rss.xml 和 state.json
          git add .
          
          # 提交（如果没有任何更改则安全退出）
          git commit -m "chore: auto update RSS, licenses, and year [skip ci]" || exit 0
          git push
